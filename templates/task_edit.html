{% extends "base.html" %}{% block content %}
<div class="page-header"><div><h1>온보딩 업무 수정</h1><p>{{ employee.name }} · {{ employee.department }}</p></div><a class="btn" href="/employees/{{ employee.id }}">돌아가기</a></div>
<section class="panel narrow"><form method="post" class="form-grid"><input type="hidden" name="employee_id" value="{{ employee.id }}"><label>업무명</label><input name="title" value="{{ task.title }}" required><label>담당부서</label><input name="owner_department" value="{{ task.owner_department }}" required><label>담당자</label><input name="assigned_to" value="{{ task.assigned_to }}" placeholder="비우면 담당부서 규칙으로 자동배정"><label>완료기한</label><input type="date" name="due_date" value="{{ task.due_date }}" required><label>구분</label><label class="checkbox"><input type="checkbox" name="required" value="1" {% if task.required %}checked{% endif %}>필수 업무</label><label>메모</label><input name="notes" value="{{ task.notes or '' }}"><div></div><div class="actions"><button class="btn primary">수정 저장</button></div></form>
<hr><form method="post" action="/tasks/{{ task.id }}/cancel" onsubmit="return confirm('{% if task.status=='취소' %}업무를 다시 활성화하시겠습니까?{% else %}이 업무를 취소 처리하시겠습니까? 기록은 남습니다.{% endif %}')"><input type="hidden" name="employee_id" value="{{ employee.id }}"><input type="hidden" name="cancelled" value="{% if task.status=='취소' %}0{% else %}1{% endif %}"><button class="btn {% if task.status!='취소' %}danger-button{% endif %}">{% if task.status=='취소' %}업무 다시 활성화{% else %}업무 취소{% endif %}</button></form></section>
{% endblock %}
