{% extends "base.html" %}{% block content %}<div class="page-header"><div><h1>{{ settings.menu_notifications }}</h1><p>완료기한이 임박했거나 지연된 온보딩 업무를 자동 추적합니다.</p></div></div><section class="panel"><table><thead><tr><th>구분</th><th>입사자</th><th>업무</th><th>담당자</th><th>내용</th><th></th></tr></thead><tbody>{% for n in rows %}<tr><td><span class="status {{ n.level }}">{{ n.level }}</span></td><td>{{ n.employee_name }}</td><td>{{ n.task_title }}</td><td>{{ n.assigned_to or '-' }}</td><td>{{ n.message }}</td><td><form method="post" action="/notifications/{{ n.id }}/ack"><button class="btn">확인</button></form></td></tr>{% else %}<tr><td colspan="6" class="empty">확인할 알림이 없습니다.</td></tr>{% endfor %}</tbody></table></section>{% endblock %}
