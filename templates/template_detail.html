{% extends "base.html" %}{% block content %}<div class="page-header"><div><h1>{{ template.name }}</h1><p>조건에 맞는 입사자가 등록되면 아래 업무가 자동 생성됩니다.</p></div><a class="btn" href="/templates">목록</a></div>
<section class="panel"><h2>템플릿 조건</h2><form method="post" action="/templates/{{ template.id }}/update" class="inline-form"><select name="process_type"><option {% if template.process_type=='온보딩' %}selected{% endif %}>온보딩</option><option {% if template.process_type=='인사이동' %}selected{% endif %}>인사이동</option><option {% if template.process_type=='퇴사' %}selected{% endif %}>퇴사</option></select><input name="name" value="{{ template.name }}" required><input name="match_department" value="{{ template.match_department }}" placeholder="부서 조건"><input name="match_job_title" value="{{ template.match_job_title }}" placeholder="직위/직책 조건"><input name="match_employment_type" value="{{ template.match_employment_type }}" placeholder="고용형태"><label class="checkbox"><input type="checkbox" name="active" value="1" {% if template.active %}checked{% endif %}>사용</label><button class="btn primary">저장</button></form></section>
<section class="panel mt"><div class="panel-title"><h2>온보딩 항목</h2><span>필수/권장 · 담당부서 · 기한 · 순서 수정 가능</span></div><table><thead><tr><th>업무명</th><th>담당부서</th><th>입사일 기준</th><th>구분</th><th>사용</th><th>순서</th><th></th></tr></thead><tbody>{% for i in items %}<tr><form method="post" action="/templates/{{ template.id }}/items/{{ i.id }}/update"><td><input name="title" value="{{ i.title }}" required></td><td><input name="owner_department" value="{{ i.owner_department }}" required></td><td><input class="small-input" type="number" name="due_offset" value="{{ i.due_offset }}">일</td><td><label class="checkbox"><input type="checkbox" name="required" value="1" {% if i.required %}checked{% endif %}>필수</label></td><td><label class="checkbox"><input type="checkbox" name="enabled" value="1" {% if i.enabled %}checked{% endif %}>사용</label></td><td><input class="small-input" type="number" name="sort_order" value="{{ i.sort_order }}"></td><td><button class="btn">저장</button></form><form method="post" action="/templates/{{ template.id }}/items/{{ i.id }}/delete" class="inline-delete"><button class="text-danger">삭제</button></form></td></tr>{% endfor %}</tbody></table></section>
<section class="panel mt"><h2>항목 추가</h2><form method="post" action="/templates/{{ template.id }}/items/new" class="inline-form"><input name="title" placeholder="업무명" required><input name="owner_department" placeholder="담당부서" required><input type="number" name="due_offset" value="0" title="입사일 기준 일수"><label class="checkbox"><input type="checkbox" name="required" value="1" checked>필수</label><input type="number" name="sort_order" value="100" title="순서"><button class="btn primary">추가</button></form></section>{% endblock %}
